name: Release playback backend

"on":
  push:
    tags:
      - "v[0-9]*"

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.architecture }} backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libpulse-dev libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build locked backend source
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TARGET_DIR: ${{ runner.temp }}/backend-target
          CARGO_TERM_COLOR: never
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          cargo build --locked --release --manifest-path backend/Cargo.toml --target "${{ matrix.target }}"

      - name: Stage exact install artifact
        env:
          ASSET: omaspotify-backend-${{ matrix.architecture }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/backend-target
        run: |
          install -D -m 0755 \
            "$CARGO_TARGET_DIR/${{ matrix.target }}/release/omaspotify-backend" \
            "${{ runner.temp }}/release/$ASSET"
          "${{ runner.temp }}/release/$ASSET" --version
          sha256sum "${{ runner.temp }}/release/$ASSET"

      - name: Attest exact install artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/release/omaspotify-backend-${{ matrix.architecture }}

      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-${{ matrix.architecture }}
          path: ${{ runner.temp }}/release/omaspotify-backend-${{ matrix.architecture }}
          if-no-files-found: error

  release:
    name: Publish attested backend release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: backend-*
          merge-multiple: true
          path: ${{ runner.temp }}/release

      - name: Create release checksums
        run: |
          cd "${{ runner.temp }}/release"
          sha256sum omaspotify-backend-* >SHA256SUMS
          cat SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ runner.temp }}/release/SHA256SUMS

      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "${{ runner.temp }}/release/omaspotify-backend-x86_64" \
            "${{ runner.temp }}/release/omaspotify-backend-aarch64" \
            "${{ runner.temp }}/release/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "OmaSpotify $RELEASE_TAG"
