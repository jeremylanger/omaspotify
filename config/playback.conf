[global]
device_name = "OmaSpotify"
device_type = "computer"
backend = "pulseaudio"
bitrate = 320
autoplay = true
normalisation = true
normalisation_pregain_db = 0
volume_controller = "softvol"
use_mpris = true
dbus_type = "session"
no_audio_cache = false
max_cache_size = 1000000000
disable_discovery = true
